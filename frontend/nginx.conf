events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        # Serve static built React files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy general API requests to liveview backend
        location /api/ {
            proxy_pass http://liveview:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Event Source SSE streaming endpoint
        location /api/stream {
            proxy_pass http://liveview:8082/api/stream;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            
            # Disable buffering for real-time SSE stream delivery
            proxy_buffering off;
            proxy_cache off;
            
            # Keep-alive settings for long connection life
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            keepalive_timeout 3600s;
        }
    }
}
