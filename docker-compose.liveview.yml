version: '3.8'

services:
  liveview:
    build:
      context: ./gordon
      dockerfile: liveview/Dockerfile
    container_name: gekko-liveview
    environment:
      - KAFKA_BROKERS=gekko-kafka:29092
      - KAFKA_OUTBOUND_TOPIC=gordon.strategies.proposed
      - PORT=8082
    restart: unless-stopped

  nginx-liveview:
    image: nginx:alpine
    container_name: gekko-nginx-liveview
    ports:
      - "8080:80"
    volumes:
      - ./gordon/liveview/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - liveview
    restart: unless-stopped

  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gekko-react-frontend
    ports:
      - "8081:80"
    depends_on:
      - liveview
    restart: unless-stopped

networks:
  default:
    name: gekko_default
    external: true
